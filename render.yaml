# Render Blueprint: Dashboard > New + > Blueprint > pick this repo.
# Secrets are marked `sync: false`: Render asks for them when the Blueprint is created (they never live in git).
services:
  - type: web
    name: ms-dashboard-landing
    runtime: node
    region: singapore
    plan: starter # the free plan sleeps after 15 minutes idle, which is bad for a booking form
    branch: main
    autoDeployTrigger: commit
    # TypeScript, Tailwind and ESLint are devDependencies, so install them for the build.
    buildCommand: npm ci --include=dev && npm run build
    # `npm start` (scripts/start.mjs) listens on Render's $PORT, and on 3107 when run locally.
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Confirmation emails, sent through the Gmail API with the Google credentials below.
      # Without a sender the booking form answers 503 on purpose.
      - key: MAIL_FROM_EMAIL # the Google account that signed in (or one of its "Send mail as" aliases)
        sync: false
      - key: MAIL_FROM_NAME # the sender name people see in their inbox
        value: MS Dashboard
      - key: MAIL_REPLY_TO # optional: where replies go (default: the From address)
        sync: false
      - key: MAIL_CC # optional: Cc on the visitor's confirmation email (comma-separated)
        sync: false
      - key: LEAD_NOTIFICATION_TO # optional: also email the team about every lead
        sync: false

      # Google Calendar + Meet bookings and Gmail sending (OAuth). Get the refresh token locally with
      # `npm run google:auth`; it must have been created after Gmail was added so it may send mail.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary

      # When the team takes calls, in Eastern Time (the pop-up always shows Eastern Time).
      - key: MEETING_HOURS
        value: 09:00-18:00
      - key: MEETING_DURATION_MIN
        value: "30"
